<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <script>
      function collectSelections() {
        return Array.from(document.querySelectorAll("input[name='availability-option']:checked"))
          .map((el) => el.value);
      }

      function collectIgnoredRecurring() {
        return Array.from(document.querySelectorAll("input[name='ignore-recurring']:checked"))
          .map((el) => el.value);
      }

      function submitOptions() {
        const selections = collectSelections();
        if (selections.length === 0) {
          document.getElementById("error").textContent = "Select at least one availability option.";
          return;
        }
        document.getElementById("error").textContent = "";
        google.script.run
          .withSuccessHandler(() => google.script.host.close())
          .withFailureHandler((err) => {
            document.getElementById("error").textContent = err.message || err;
          })
          .insertAvailabilityFromDialog({
            selections,
            ignoreRecurringIds: collectIgnoredRecurring(),
          });
      }

      function renderRecurringEvents(events) {
        const container = document.getElementById("recurring-events");
        if (!events || events.length === 0) {
          container.innerHTML = "<p style='margin:6px 0; color:#666;'>No recurring events in the next two weeks.</p>";
          return;
        }
        container.innerHTML = events
          .map((event) => (
            "<label style='display:block; margin:4px 0;'>" +
              "<input type='checkbox' name='ignore-recurring' value='" + event.id + "'>" +
              "<span style='margin-left:6px;'>" +
                event.title + " (" + event.time + ")" +
              "</span>" +
            "</label>"
          ))
          .join("");
      }

      function loadRecurringEvents() {
        google.script.run
          .withSuccessHandler(renderRecurringEvents)
          .withFailureHandler((err) => {
            document.getElementById("recurring-events").innerHTML =
              "<p style='margin:6px 0; color:#b00;'>Unable to load recurring events.</p>";
            document.getElementById("error").textContent = err.message || err;
          })
          .getRecurringEventSeriesOptions();
      }

      window.addEventListener("load", loadRecurringEvents);
    </script>
  </head>
  <body style="font-family:Arial,sans-serif;">
    <div style="margin-bottom:12px;">
      <strong>Choose availability options</strong>
      <label style="display:block; margin:6px 0;">
        <input type="checkbox" name="availability-option" value="THIS_WEEK_2H">
        <span style="margin-left:6px;">Rest of this week including today — 2 hour blocks</span>
      </label>
      <label style="display:block; margin:6px 0;">
        <input type="checkbox" name="availability-option" value="THIS_WEEK_ALL">
        <span style="margin-left:6px;">Rest of this week including today — all availability</span>
      </label>
      <label style="display:block; margin:6px 0;">
        <input type="checkbox" name="availability-option" value="NEXT_WEEK_2H">
        <span style="margin-left:6px;">Next week — 2 hour blocks</span>
      </label>
      <label style="display:block; margin:6px 0;">
        <input type="checkbox" name="availability-option" value="NEXT_WEEK_ALL">
        <span style="margin-left:6px;">Next week — all availability</span>
      </label>
    </div>

    <div style="margin-bottom:12px;">
      <strong>Recurring events in the next two weeks</strong>
      <p style="margin:6px 0; color:#666; font-size:12px;">
        Check any recurring events you want to ignore when calculating availability.
      </p>
      <div id="recurring-events"></div>
    </div>

    <div id="error" style="color:#b00; font-size:12px; margin-bottom:8px;"></div>
    <button onclick="submitOptions()">Insert</button>
    <p style="font-size:12px; color:#666;">
      Window 10:00 to 18:30. Declined events are free. Accepted, maybe, invited, and owner are busy.
    </p>
  </body>
</html>
